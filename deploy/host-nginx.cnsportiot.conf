    ## HOOPSHAKE 前端（学生端 / 教师端）
    server {
        listen       443 ssl http2;
        server_name  hoopshake.cnsportiot.com;

        ssl_certificate      hoopshake.cnsportiot.com_bundle.crt;
        ssl_certificate_key  hoopshake.cnsportiot.com.key;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
        ssl_prefer_server_ciphers on;

        error_log  /home/ubuntu/cnsportiot/logs/hoopshake-error.log;
        access_log /home/ubuntu/cnsportiot/logs/hoopshake-access.log;

        # 知识库导入的 Markdown 可能较大
        client_max_body_size 20m;

        # AI 对话、课堂实况是 SSE 长连接，必须单独放行
        location /api/ {
            proxy_http_version  1.1;
            proxy_pass          http://127.0.0.1:8082;
            proxy_set_header    Connection          "";
            proxy_set_header    Host                $http_host;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;

            # 这三条是 SSE 的命门：少了 AI 回复会「憋住不出字」
            proxy_buffering off;
            proxy_cache     off;
            gzip            off;

            send_timeout          3600;
            proxy_connect_timeout 60;
            proxy_send_timeout    3600;
            proxy_read_timeout    3600;    # 心跳 15s/次，默认 60s 会掐断
        }

        # 页面与静态资源。容器内部已做完路由，这里整体转发即可
        location / {
            proxy_http_version  1.1;
            proxy_pass          http://127.0.0.1:8082;
            proxy_set_header    Connection          "";
            proxy_set_header    Host                $http_host;
            proxy_set_header    X-Forwarded-Proto   $scheme;
            proxy_set_header    X-Real-IP           $remote_addr;
            proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;

            proxy_read_timeout  60;
        }

        error_page  404              /404.html;
        location = /404.html {
            root   /usr/local/nginx/html;
        }
        error_page   500 502 503 504  /500.html;
        location = /500.html {
            root   html;
        }
    }
