<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      interactive-widget=resizes-content：软键盘弹出时让**布局视口**跟着变矮。
      不写这一条时 Android Chrome 默认是 resizes-visual —— 布局视口不变，
      底部 absolute 定位的输入条就被键盘盖住了。iOS 不认这个参数，另由
      main.js 里的 visualViewport 兜底。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#F4F4F1" />
    <meta name="description" content="Hoopshake 学生端：查看训练报告、课堂反馈，随时问 AI 教练" />
    <meta name="format-detection" content="telephone=no" />
    <!-- 添加到主屏幕后按独立应用打开，不带地址栏 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hoopshake" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Hoopshake · 学生端</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FF6A2C'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
