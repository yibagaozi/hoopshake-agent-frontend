# 本地开发/自测用：从源码构建并起前端。
# 生产环境请用服务器上的 /opt/hoopshake/docker-compose.yml —— 那边 backend、redis、
# frontend 同属一个 compose 网络，前端镜像直接从阿里云 ACR 拉取（由 CI 推送）。
#
#   docker compose up -d --build
#   → 学生端 http://localhost/student/    教师端 http://localhost/teacher/

services:
  frontend:
    build:
      context: .
      args:
        STUDENT_BASE: /student/
        TEACHER_BASE: /teacher/
        API_BASE_URL: ""          # 同源，交给 nginx 反代
    image: crpi-fgo4g7v7lir6fd0o.cn-beijing.personal.cr.aliyuncs.com/hoopshake/frontend:dev
    container_name: hoopshake-frontend-dev
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # 本地没有 compose 内的 backend 服务时，指向宿主机上的后端
      BACKEND_ORIGIN: http://host.docker.internal:8080
      BACKEND_RESOLVER: 127.0.0.11
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
