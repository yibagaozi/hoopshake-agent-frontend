name: Build

on:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: 'Login to Aliyun Container Registry'
        uses: docker/login-action@v3
        with:
          registry: crpi-fgo4g7v7lir6fd0o.cn-beijing.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: 'Build & Push'
        env:
          REGISTRY: crpi-fgo4g7v7lir6fd0o.cn-beijing.personal.cr.aliyuncs.com
          IMAGE_NAME: hoopshake/frontend
          # Dockerfile 所在目录。若日后把项目平铺到仓库根目录，这里改成 .
          CONTEXT: ./hoopshake-frontend
        run: |
          branch_name=${GITHUB_REF##*/}
          echo "当前分支: $branch_name"

          if [ "$branch_name" = "master" ]; then
            tag="latest"
          elif [ "$branch_name" = "develop" ]; then
            tag="develop"
          else
            echo "非目标分支，退出构建"
            exit 0
          fi

          sha_tag="${tag}-${GITHUB_SHA::7}"
          echo "使用 tag: $tag 与 $sha_tag"

          docker build ${CONTEXT} \
            --tag ${REGISTRY}/${IMAGE_NAME}:$tag \
            --tag ${REGISTRY}/${IMAGE_NAME}:$sha_tag
          docker push ${REGISTRY}/${IMAGE_NAME}:$tag
          docker push ${REGISTRY}/${IMAGE_NAME}:$sha_tag
