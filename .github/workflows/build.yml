name: Build

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # 云端：学生端 /student/ + 教师端 /teacher/
          - name: cloud
            image: hoopshake/hoopshake-agent-frontend-cloud
            dockerfile: docker/cloud.Dockerfile
          # 场边：操作台 /console/* + 大屏 /display
          - name: edge
            image: hoopshake/hoopshake-agent-frontend-edge
            dockerfile: docker/edge.Dockerfile

    steps:
      - name: "Checkout GitHub Action"
        uses: actions/checkout@v4

      - name: "Login to Aliyun Container Registry"
        uses: docker/login-action@v3
        with:
          registry: crpi-fgo4g7v7lir6fd0o.cn-beijing.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: "Build & Push"
        env:
          REGISTRY: crpi-fgo4g7v7lir6fd0o.cn-beijing.personal.cr.aliyuncs.com
          IMAGE_NAME: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          branch_name=${GITHUB_REF##*/}
          echo "当前分支: $branch_name  构建目标: ${{ matrix.name }}"

          if [ "$branch_name" = "main" ]; then
            tag="latest"
          elif [ "$branch_name" = "develop" ]; then
            tag="develop"
          else
            echo "非目标分支，退出构建"
            exit 0
          fi

          sha_tag="${tag}-${GITHUB_SHA::7}"
          echo "使用 tag: $tag 与 $sha_tag"

          # 构建上下文为仓库根，两个镜像共用同一份 workspace 与 lockfile
          docker build . --file ${DOCKERFILE} \
            --build-arg GIT_SHA=${GITHUB_SHA} \
            --tag ${REGISTRY}/${IMAGE_NAME}:$tag \
            --tag ${REGISTRY}/${IMAGE_NAME}:$sha_tag
          docker push ${REGISTRY}/${IMAGE_NAME}:$tag
          docker push ${REGISTRY}/${IMAGE_NAME}:$sha_tag
